[package]
name = "sd_tester"
version = "0.1.0"
edition = "2024"
description = "Native Windows SD/USB diagnostic and benchmarking tool"
repository = "https://github.com/hibyemy/sd_tester"
license = "MIT"

[package.metadata.wix]
manufacturer = "sd_tester contributors"
product-name = "SD/USB Native Tester"
upgrade-guid = "F2B8E248-6BC7-4D9F-AB44-5A9F6C8F5A9F"
path-guid = "4C8A13D1-D8E0-4A89-9A67-112AA7D24802"
license = false

[dependencies]
eframe = "0.33"
egui = "0.33"
egui_plot = "0.34"
windows-sys = { version = "0.61", features = [
    "Win32_Storage_FileSystem",
    "Win32_Foundation",
    "Win32_System_IO",
    "Win32_Security",
    "Win32_System_Threading",
    "Win32_System_SystemServices",
] }
xxhash-rust = { version = "0.8", features = ["xxh3"] }
runas = "1"
rand = "0.9"

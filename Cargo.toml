[package]
name = "sd_tester"
version = "0.1.0"
edition = "2024"

[dependencies]
eframe = "0.33"
egui = "0.33"
egui_plot = "0.34"
windows-sys = { version = "0.61", features = [
    "Win32_Storage_FileSystem",
    "Win32_Foundation",
    "Win32_System_IO",
    "Win32_Security",
    "Win32_System_Threading",
    "Win32_System_SystemServices",
] }
xxhash-rust = { version = "0.8", features = ["xxh3"] }
runas = "1"
rand = "0.9"

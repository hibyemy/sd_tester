name: Release Windows Artifacts

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Existing or new tag to release (for example v0.1.1)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve release tag
        id: vars
        shell: pwsh
        run: |
          if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            $tag = "${{ inputs.tag_name }}"
          } else {
            $tag = "${{ github.ref_name }}"
          }
          "release_tag=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: swatinem/rust-cache@v2

      - name: Build release executable
        run: cargo build --release

      - name: Create portable zip
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path dist -Force | Out-Null
          $tag = "${{ steps.vars.outputs.release_tag }}"
          $zipName = "sd_tester-$tag-windows-x64.zip"
          $exeName = "sd_tester-$tag-windows-x64.exe"
          Copy-Item "target/release/sd_tester.exe" "dist/$exeName" -Force
          Compress-Archive -Path "target/release/sd_tester.exe" -DestinationPath "dist/$zipName" -Force

      - name: Install WiX Toolset and cargo-wix
        shell: pwsh
        run: |
          choco install wixtoolset -y --no-progress
          cargo install cargo-wix --locked

      - name: Build MSI installer
        continue-on-error: true
        shell: pwsh
        run: |
          $tag = "${{ steps.vars.outputs.release_tag }}"
          $msiName = "sd_tester-$tag-windows-x64.msi"
          cargo wix --no-build --output "dist/$msiName"

      - name: Create or update GitHub release
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ steps.vars.outputs.release_tag }}
          name: ${{ steps.vars.outputs.release_tag }}
          allowUpdates: true
          artifactErrorsFailBuild: true
          draft: false
          prerelease: false
          generateReleaseNotes: true
          artifacts: "dist/*.zip,dist/*.exe,dist/*.msi"

name: Release Windows Artifacts

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Existing or new tag to release (for example v0.1.1)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest
    env:
      RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || inputs.tag_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: swatinem/rust-cache@v2

      - name: Build release executable
        run: cargo build --release

      - name: Create portable zip
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path dist -Force | Out-Null
          $zipName = "sd_tester-$env:RELEASE_TAG-windows-x64.zip"
          Compress-Archive -Path "target/release/sd_tester.exe" -DestinationPath "dist/$zipName" -Force

      - name: Install WiX Toolset and cargo-wix
        shell: pwsh
        run: |
          choco install wixtoolset -y --no-progress
          cargo install cargo-wix --locked

      - name: Build MSI installer
        shell: pwsh
        run: |
          $msiName = "sd_tester-$env:RELEASE_TAG-windows-x64.msi"
          cargo wix --no-build --output "dist/$msiName"

      - name: Create or update GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: ${{ env.RELEASE_TAG }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            dist/*.zip
            dist/*.msi
